# =====================================================
# SISTEMA IVN - Docker Stack (Swarm)
# Deploy em produção com Traefik + SSL
# =====================================================

services:
  app:
    image: automacaodebaixocusto/sistema-igreja:v1.0.0
    
    networks:
      - network_public
    
    environment:
      NODE_ENV: production
      PORT: 5000

      # Banco de dados (PostgreSQL externo do servidor)
      DB_HOST: ${DB_HOST}
      DB_PORT: ${DB_PORT:-5432}
      DB_NAME: ${DB_NAME:-igreja_db}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}

      # JWT
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-7d}
      FRONTEND_URL: ${FRONTEND_URL:-https://ivn.exemplo.top}

      # Storage: local (padrão) ou s3 (MinIO / AWS S3)
      STORAGE_TYPE: ${STORAGE_TYPE:-local}
      S3_ENDPOINT: ${S3_ENDPOINT:-}
      S3_BUCKET: ${S3_BUCKET:-sistema-ivn}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-}
      S3_USE_SSL: ${S3_USE_SSL:-false}
      S3_REGION: ${S3_REGION:-us-east-1}

      # SMTP para envio de emails (opcional)
      SMTP_ENABLED: ${SMTP_ENABLED:-false}
      SMTP_HOST: ${SMTP_HOST:-smtp.gmail.com}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_SECURE: ${SMTP_SECURE:-false}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      SMTP_FROM: ${SMTP_FROM:-Sistema IVN <noreply@exemplo.com>}
    
    volumes:
      - uploads:/app/uploads
    
    deploy:
      replicas: 2
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
        window: 120s
      update_config:
        parallelism: 1
        delay: 10s
        order: start-first
      resources:
        limits:
          cpus: '1'
          memory: 512M
        reservations:
          cpus: '0.25'
          memory: 256M
      labels:
        - "traefik.enable=true"
        - "traefik.http.routers.sistema-ivn.rule=Host(`ivn.exemplo.top`)"
        - "traefik.http.routers.sistema-ivn.entrypoints=websecure"
        - "traefik.http.routers.sistema-ivn.tls.certresolver=letsencryptresolver"
        - "traefik.http.services.sistema-ivn.loadbalancer.server.port=5000"
        - "traefik.docker.network=network_public"

networks:
  network_public:
    external: true

volumes:
  uploads:
    driver: local
