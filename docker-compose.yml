# =====================================================
# SISTEMA IVN - Docker Compose
# App (Frontend + Backend) + PostgreSQL
# =====================================================

services:
  # --- Banco de Dados PostgreSQL ---
  db:
    image: postgres:16
    platform: linux/amd64
    container_name: sistema-ivn-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: igreja_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${DB_PASSWORD:-123456}
    ports:
      - "${DB_PORT_EXTERNAL:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      # Executa o schema na primeira inicialização
      - ./database_schema_jornada_unica.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d igreja_db"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  # --- Aplicação (Backend + Frontend) ---
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: sistema-ivn-app
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 5000

      # Banco de dados
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: igreja_db
      DB_USER: postgres
      DB_PASSWORD: ${DB_PASSWORD:-123456}

      # JWT
      JWT_SECRET: ${JWT_SECRET:-troque-este-segredo-em-producao}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-7d}
    ports:
      - "${APP_PORT:-3000}:5000"
    volumes:
      - uploads:/app/uploads

volumes:
  pgdata:
    driver: local
  uploads:
    driver: local
