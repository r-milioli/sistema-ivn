version: '3.8'

services:
  postgres:
    build:
      context: .
      dockerfile: docker/Dockerfile
    container_name: igreja_db
    environment:
      POSTGRES_USER: igreja_user
      POSTGRES_PASSWORD: igreja_password
      POSTGRES_DB: igreja_db
      PGDATA: /var/lib/postgresql/data/pgdata
    ports:
      - "5432:5432"
    volumes:
      # Volume para persistência de dados
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U igreja_user -d igreja_db"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  postgres_data:
    driver: local

